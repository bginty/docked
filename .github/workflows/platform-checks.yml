name: Docked platform checks
on:
  pull_request:
  push:
    branches: [codex/docked-value-platform]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: preview
      SITE_URL: http://localhost:3000
      SENDING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_SECRET_KEY: DOCKED_BUILD_CANARY_SUPABASE_20261002
          ODDS_API_KEY: DOCKED_BUILD_CANARY_ODDS_20261002
          EMAIL_API_KEY: DOCKED_BUILD_CANARY_EMAIL_20261002
      - run: npm run check:client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docked-qa
          path: |
            test-results/
            docs/qa/platform/
            docs/qa/phase2/
