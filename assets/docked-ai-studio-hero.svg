    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#073f43"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff9b82"/>
      <stop offset="1" stop-color="#f46f5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
