<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI website and logo studio workspace</title>
  <desc id="desc">A clean desk with a laptop, tablet, logo boards, colour swatches, and website layout cards.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="0.55" stop-color="#f5fbf7"/>
      <stop offset="1" stop-color="#e9f4ef"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
